
name: CSharp CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Restore dependencies
        run: dotnet restore myApp.Tests/myApp.Tests.csproj

      - name: Build project
        run: dotnet build myApp.Tests/myApp.Tests.csproj --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test myApp.Tests/myApp.Tests.csproj --configuration Release --no-build
